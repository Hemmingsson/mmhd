# Optional local build of the SpotiFLAC sidecar. MMHD builds its API and frontend from source by default.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  # Only built when the spotiflac profile is active (COMPOSE_PROFILES=spotiflac); otherwise ignored.
  spotiflac:
    build:
      context: ./sidecars/spotiflac
      dockerfile: Dockerfile
